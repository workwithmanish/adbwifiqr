name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NODE_OPTIONS: --throw-deprecation
      - run: node src/cli.js --help
      - run: node --check src/cli.js
      - run: node --check src/adb.js
      - run: node --check src/ui.js
      - run: npm pack
      - run: node scripts/check-package.cjs
      - run: npm install --global --prefix "${{ runner.temp }}/adbwifiqr-cli" ./adbwifiqr-1.4.0.tgz
      - name: Check installed command (Linux and macOS)
        if: runner.os != 'Windows'
        run: '"${{ runner.temp }}/adbwifiqr-cli/bin/adbwifiqr" --help'
      - name: Check installed command (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${{ runner.temp }}/adbwifiqr-cli/adbwifiqr.cmd" --help'

  npm12:
    name: Archive installation / npm 12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@12
      - run: npm --version
      - name: Install without deprecated URL parsing
        run: npm install --global --prefix "${{ runner.temp }}/adbwifiqr-cli-npm12" --allow-remote=all --prefer-online "https://codeload.github.com/workwithmanish/adbwifiqr/tar.gz/${{ github.sha }}"
        env:
          NODE_OPTIONS: '--require "${{ github.workspace }}/fixtures/forbid-legacy-url.cjs"'
      - if: runner.os != 'Windows'
        run: '"${{ runner.temp }}/adbwifiqr-cli-npm12/bin/adbwifiqr" --help'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${{ runner.temp }}/adbwifiqr-cli-npm12/adbwifiqr.cmd" --help'
