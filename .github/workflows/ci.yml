name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node src/cli.js --help
      - run: node --check src/cli.js
      - run: node --check src/adb.js
      - run: node --check src/ui.js
      - run: npm pack
      - run: npm install --global --prefix "${{ runner.temp }}/adbwifiqr-cli" ./adbwifiqr-1.1.0.tgz
      - name: Check installed command (Linux and macOS)
        if: runner.os != 'Windows'
        run: '"${{ runner.temp }}/adbwifiqr-cli/bin/adbwifiqr" --help'
      - name: Check installed command (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${{ runner.temp }}/adbwifiqr-cli/adbwifiqr.cmd" --help'
